<!DOCTYPE html>
<html lang="en">

<head>
  <title>SRV THEME Admin Login</title>
  <script src="../../script/js/loadAssets.js"></script>
</head>

<body>
  <div class="container">
    <div class="row">
      <div class="col-12 text-center">
        <form class="text-start w-50 mx-auto my-5" onsubmit="event.preventDefault();">
          <h3 class="mb-3 text-center">Admin Log In</h3>
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" minlength="8" maxlength="24" />
          </div>
          <button type="submit" class="btn btn-primary w-100 mb-4">
            Sign In
          </button>
        </form>
      </div>
    </div>
  </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <title>Forgot Password</title>
  <script src="../../script/js/loadAssets.js"></script>
</head>

<body>
  <div class="container">
    <div class="row">
      <div class="col-12 text-center">
        <form class="text-start w-50 mx-auto my-5"
          onsubmit="event.preventDefault();location.href = 'modules/user/confirm-mail.html'">
          <h3 class="mb-3 text-center">Recover Password</h3>
          <p>
            Enter your email address and we'll send you an email with
            instructions to reset your password.
          </p>
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" aria-describedby="emailHelp" />
          </div>
          <button type="submit" class="btn btn-primary w-100 mb-4">
            Reset Password
          </button>
          <p class="text-center">
            Back to <a href="modules/user/login.html"> Sign In</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <title>Reset Password</title>
    <script src="../../script/js/loadAssets.js"></script>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-12 text-center">
                <form class="text-start w-50 mx-auto my-5" onsubmit="event.preventDefault();">
                    <h3 class="mb-3 text-center">Reset Password</h3>
                    <div class="mb-3">
                        <label for="oldPassword" class="form-label">Old Password</label>
                        <input type="password" class="form-control" id="oldPassword" minlength="8" maxlength="24" />
                    </div>
                    <div class="mb-3">
                        <label for="newPassword" class="form-label">New Password</label>
                        <input type="password" class="form-control" id="newPassword" minlength="8" maxlength="24" />
                    </div>
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmPassword" minlength="8" maxlength="24" />
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-4">
                        Reset Password
                    </button>
                    <p class="text-center">
                        Back to<a href="modules/user/login.html"> Sign In</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
